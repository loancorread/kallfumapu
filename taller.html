<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Taller Datos Kallfü Mapu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app móvil de una columna (participantes) + modo proyección a pantalla completa (facilitador). Paleta institucional azul/verde Kallfü. */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --sunk:#e9eef5; --ink:#132033; --muted:#566479; --line:#d6dee9;
  --blue:#1c4587; --blue-ink:#ffffff; --blue-soft:#dfe8f7; --green:#227a55; --green-soft:#5bcb96; --green-tint:#dff4ea;
  --n1:#c2410c; --n1-tint:#fbe5da; --n2:#b7862b; --n2-tint:#f6ecd6; --n3:#227a55;
  --focus:#2563eb;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
/* Tema: claro por defecto; el botón de la app cambia a oscuro (atributo propio data-km) */
:root{color-scheme:light}
:root[data-km="dark"]{
  --bg:#0c1422; --surface:#132036; --sunk:#0f1a2c; --ink:#e6edf7; --muted:#9aa9bf; --line:#263752;
  --blue:#7ea4ea; --blue-ink:#0c1422; --blue-soft:#1b2c4a; --green:#5bcb96; --green-soft:#5bcb96; --green-tint:#143528;
  --n1:#f08a5d; --n1-tint:#3a2016; --n2:#e0b55e; --n2-tint:#352a14; --n3:#5bcb96; --focus:#93b4ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- franja tejida (ñimin geométrico) ---- */
.weave{height:12px;background-color:var(--blue);
  background-image:linear-gradient(135deg,var(--green-soft) 25%,transparent 25%),linear-gradient(225deg,var(--green-soft) 25%,transparent 25%),linear-gradient(315deg,var(--green-soft) 25%,transparent 25%),linear-gradient(45deg,var(--green-soft) 25%,transparent 25%);
  background-size:12px 12px;background-position:0 0,6px 0,6px -6px,0 6px}

/* ---- barra superior ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blue);color:var(--blue-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.top .brand{font-family:var(--f-display);font-weight:700;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:transparent;border:1px solid color-mix(in srgb,var(--blue-ink) 45%,transparent);color:var(--blue-ink);border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer}

main{padding-block:20px 110px}
section.view{display:grid;gap:18px}

/* ---- inicio ---- */
.hero{display:grid;gap:10px;padding-block:6px 4px}
.hero h1{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;letter-spacing:-.01em}
.hero p{color:var(--muted);max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--blue)}
.tile b{font-family:var(--f-display);font-size:1.25rem}
.tile span{color:var(--muted);font-size:.9rem}
.tile.wide{grid-column:1/-1}
.tile.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.tile.primary span{color:inherit;opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:1.15rem}
.card h3{font-size:1rem}
.note{font-size:.88rem;color:var(--muted)}
.callout{border-left:4px solid var(--blue);background:var(--blue-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.95rem}

/* ---- tabs grupo ---- */
.ghead{display:grid;gap:4px}
.ghead h1{font-size:1.7rem;font-weight:800}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding-block:6px}
.tabbar button{border:0;background:transparent;border-radius:8px;padding:8px 2px;font-weight:600;font-size:.8rem;min-width:0;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
.tabbar button i{font-style:normal;font-family:var(--f-data);font-size:.7rem}
.tabbar button[aria-selected="true"]{background:var(--blue-soft);color:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

/* ---- datos ---- */
.src{display:grid;gap:12px}
.src-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.src-h small{color:var(--muted);font-size:.8rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:10px;display:grid;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-data);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--muted);line-height:1.25}
.kpi.alert{background:var(--n1-tint)} .kpi.alert .v{color:var(--n1)}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.stack div{display:flex;align-items:center;justify-content:center;font-family:var(--f-data);font-size:.75rem;font-weight:600;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack .s1{background:var(--n1)} .stack .s2{background:var(--n2)} .stack .s3{background:var(--n3)}
:root[data-km="dark"] .stack div{color:#0c1422}
.themebtn{min-width:2.4em;font-size:1rem!important;line-height:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:4px 10px;align-items:center;font-size:.88rem}
.bar .t{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.bar .track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;grid-column:1/2}
.bar .fill{height:100%;background:var(--blue);border-radius:4px}
.bar.low .fill{background:var(--n1)}
.bar .pv{font-family:var(--f-data);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.items{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.items li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:.9rem;padding:8px 10px;background:var(--sunk);border-radius:8px}
.items .q{font-family:var(--f-data);font-size:.72rem;color:var(--muted);white-space:nowrap}
.items .p{font-family:var(--f-data);font-weight:600;color:var(--n1)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini div{text-align:center;padding:8px 4px;border-radius:8px;background:var(--sunk)}
.mini b{display:block;font-family:var(--f-data);font-size:1.15rem}
.mini small{font-size:.72rem;color:var(--muted)}
.mini .up b{color:var(--green)} .mini .down b{color:var(--n1)}
.coh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.coh span{background:var(--sunk);border-radius:6px;padding:3px 8px;font-family:var(--f-data);font-size:.8rem}
.lnk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem}
.pistas{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:p}
.pistas li{counter-increment:p;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:.95rem}
.pistas li::before{content:counter(p);width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--blue-ink);font-family:var(--f-data);font-size:.8rem;display:grid;place-items:center}
details.src-d{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.src-d>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.src-d>summary::-webkit-details-marker{display:none}
details.src-d>summary h3{font-size:1.02rem}
details.src-d>summary .tag{font-size:.75rem;color:var(--muted)}
details.src-d>summary::after{content:"+";font-family:var(--f-data);font-size:1.2rem;color:var(--muted)}
details.src-d[open]>summary::after{content:"–"}
details.src-d>.body{padding:0 16px 16px;display:grid;gap:12px}
.na{font-size:.9rem;color:var(--muted);font-style:italic}

/* ---- pauta ---- */
.mom{display:grid;gap:10px}
.mom-h{display:flex;align-items:center;gap:12px}
.mom-h .badge{font-family:var(--f-data);font-weight:600;background:var(--blue);color:var(--blue-ink);border-radius:8px;padding:6px 10px;font-size:.85rem;white-space:nowrap}
.mom-h h2{font-size:1.25rem;flex:1;min-width:0}
.mom ol,.mom ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer .clock{font-family:var(--f-data);font-size:1.6rem;font-weight:600;min-width:5ch;font-variant-numeric:tabular-nums}
.timer .clock.over{color:var(--n1)}
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--blue-ink);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
.roles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.role{background:var(--sunk);border-radius:8px;padding:10px;font-size:.9rem}
.role b{display:block;font-family:var(--f-display)}

/* ---- insumo ---- */
form{display:grid;gap:16px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0;display:grid;gap:12px;background:var(--surface);min-width:0}
legend{font-family:var(--f-display);font-weight:700;padding:0 6px;font-size:1.05rem}
label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-weight:400}
textarea{min-height:56px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;background:var(--bg)}
.chips input{accent-color:var(--blue)}
.sub{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.sub-h{font-family:var(--f-data);font-size:.78rem;color:var(--blue);font-weight:600;letter-spacing:.04em}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:.88rem;color:var(--muted)}
.status.ok{color:var(--green)} .status.err{color:var(--n1)}
.picker{display:grid;gap:8px}
.picker>details{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.picker>details>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.picker>details>summary::-webkit-details-marker{display:none}
.picker>details>summary::after{content:"▾";color:var(--muted)}
.picker>details[open]>summary::after{content:"▴"}
.picker .panel{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:10px;max-height:340px;overflow:auto}
.picker .panel .grp{display:grid;gap:2px}
.picker .panel .grp>span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:4px 0}
.picker .opt{display:flex;align-items:center;gap:10px;font-weight:400;padding:7px 4px;border-radius:6px;cursor:pointer}
.picker .opt:hover{background:var(--sunk)}
.picker .opt input{width:18px;height:18px;accent-color:var(--blue);flex:none}
.selchips{display:flex;flex-wrap:wrap;gap:6px}
.selchips button{border:1px solid var(--blue);background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 10px;font-size:.85rem;font-weight:600;cursor:pointer}
.selchips .tally{font-size:.85rem;color:var(--muted);align-self:center}
.counter{font-family:var(--f-data);font-size:.75rem;color:var(--muted);justify-self:end}

/* ---- plenario ---- */
.plen{display:grid;gap:14px}
.plen .big{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.2}
.plen dl{margin:0;display:grid;gap:10px}
.plen dt{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.plen dd{margin:0;font-size:1.05rem}

/* ---- apuesta ---- */
.bet{display:grid;gap:10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 8px;font-family:var(--f-data);font-weight:600;font-size:1.05rem;cursor:pointer}
.opts button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.opts button.right{border-color:var(--green);background:var(--green-tint);color:var(--green)}
.reveal{border-radius:8px;background:var(--green-tint);padding:10px 12px;font-size:.95rem}

/* ---- proyección ---- */
body.present{overflow:hidden}
body.present .top,body.present main,body.present .tabbar{display:none}
#deck{position:fixed;inset:0;display:none;background:var(--bg);z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.present #deck{display:grid;grid-template-rows:auto 1fr auto}
.split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(14px,2.2vw,28px);align-items:center}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.slide{display:none;overflow:auto;padding:clamp(18px,3vw,44px) max(clamp(20px,5vw,72px),env(safe-area-inset-left,0px));gap:clamp(14px,2.2vw,28px);align-content:start}
.slide.on{display:grid}
.slide h1{font-size:clamp(2rem,5vw,4.2rem);font-weight:800;letter-spacing:-.015em;max-width:20ch}
.slide h2{font-size:clamp(1.6rem,3.4vw,3rem);font-weight:800;max-width:26ch}
.slide p.lead{font-size:clamp(1.05rem,1.8vw,1.6rem);color:var(--muted);max-width:52ch}
.slide .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(10px,1.6vw,20px)}
.slide .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(10px,1.6vw,20px)}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,1.8vw,24px);display:grid;gap:8px;align-content:start;min-width:0}
.pc h3{font-size:clamp(1.1rem,1.7vw,1.5rem)}
.pc p,.pc li{font-size:clamp(.95rem,1.25vw,1.15rem)}
.pc ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.pc .bignum{font-family:var(--f-data);font-size:clamp(1.7rem,3.2vw,2.9rem);font-weight:600;color:var(--blue);line-height:1}
.pc.alert .bignum{color:var(--n1)}
.deck-top{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-left,0px)) 8px;background:var(--blue);color:var(--blue-ink)}
.deck-top .brand{font-family:var(--f-display);font-weight:700;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.deck-top .clockmini{font-family:var(--f-data);font-size:.95rem}
.deck-nav{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.deck-nav .dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.deck-nav .dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.deck-nav .dots button[aria-current="true"]{background:var(--blue);width:24px;border-radius:5px}
.deck-nav .btn{padding:7px 14px}
.qrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(10px,1.6vw,20px)}
.qr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;justify-items:center;text-align:center}
.qr .code{background:#fff;padding:10px;border-radius:8px;line-height:0}
.qr .code img,.qr .code canvas{width:150px;height:150px}
.qr b{font-family:var(--f-display);font-size:1.2rem}
.qr small{color:var(--muted)}
.bigtimer{font-family:var(--f-data);font-size:clamp(4rem,14vw,11rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.phase{display:grid;grid-template-columns:10fr 8fr 12fr;gap:6px}
.phase div{border-radius:8px;padding:12px;background:var(--sunk);display:grid;gap:2px}
.phase div.on{background:var(--blue);color:var(--blue-ink)}
.phase div b{font-family:var(--f-display);font-size:clamp(1rem,1.8vw,1.5rem)}
.phase div span{font-family:var(--f-data);font-size:.85rem}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.wall .pc .who{font-family:var(--f-data);font-size:.8rem;color:var(--muted)}
.wall .pc dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.wall .pc dd{margin:0 0 6px}
.wall dl{margin:0}
.dist{display:grid;gap:6px}
.dist .bar{font-size:clamp(.9rem,1.2vw,1.1rem)}
.words{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.words span{font-family:var(--f-display);font-weight:700;color:var(--blue)}
@media (max-width:520px){.tiles{grid-template-columns:1fr}.row3{grid-template-columns:1fr}.mini{grid-template-columns:repeat(2,1fr)}.phase{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .6s ease}}
</style>
</head>
<body>
<script>try{document.documentElement.setAttribute("data-km",localStorage.getItem("km-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-km","light")}</script>

<header class="top" id="top">
  <div class="weave" aria-hidden="true"></div>
  <div class="wrap">
    <span class="brand" id="brand">Taller de análisis de datos · Kallfü Mapu</span>
    <button type="button" id="homeBtn" hidden>Inicio</button>
    <button type="button" class="themebtn" data-theme-toggle aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">☾</button>
  </div>

function bar(label,v,low){return `<div class="bar${low?" low":""}"><div class="t"><span>${esc(label)}</span></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,v))}%"></div></div><span class="pv">${f1(v)}%</span></div>`}
function stack(niv){
  const [a,b,c]=niv;
  const seg=(v,cl)=>v>0?`<div class="${cl}" style="width:${v}%">${v>=9?Math.round(v)+"%":""}</div>`:"";
  return `<div class="stack" role="img" aria-label="Nivel I ${f1(a)}%, nivel II ${f1(b)}%, nivel III ${f1(c)}%">${seg(a,"s1")}${seg(b,"s2")}${seg(c,"s3")}</div>

}
function itemsList(items){return `<ul class="items">${items.map(i=>`<li><span class="q">${esc(i[0])}</span><span>${esc(i[1])}</span><span class="p">${f1(i[2])}%</span></li>`).join("")}</ul>`}

const timers={};
function bindTimers(){
  document.querySelectorAll(".timer").forEach(el=>{
    const id=el.dataset.id, min=+el.dataset.min, clock=$(".clock",el), b=el.querySelector('[data-act="start"]');
    const t=timers[id]||(timers[id]={end:null,left:min*60,run:false,iv:null});
    const paint=()=>{const left=t.run?Math.round((t.end-Date.now())/1000):t.left;const a=Math.abs(left);clock.textContent=(left<0?"+":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");clock.classList.toggle("over",left<0);b.textContent=t.run?"Pausar":"Iniciar"};
    const tick=()=>{ if(!document.body.contains(clock)){clearInterval(t.iv);t.iv=null;return} paint() };
    if(t.run&&!t.iv) t.iv=setInterval(tick,500);
    b.onclick=()=>{ if(t.run){t.left=Math.round((t.end-Date.now())/1000);t.run=false;clearInterval(t.iv);t.iv=null} else {t.end=Date.now()+t.left*1000;t.run=true;t.iv=setInterval(tick,500)} paint() };
    el.querySelector('[data-act="reset"]').onclick=()=>{t.run=false;clearInterval(t.iv);t.iv=null;t.left=min*60;paint()};
    paint();
  });
}

function namesOf(ids){return ids.map(i=>STAFF_BY[i]).filter(Boolean).map(p=>p.n).join(", ")}
function tally(ids){const c={d:0,e:0,a:0};ids.forEach(i=>{const p=STAFF_BY[i];if(p)c[p.r]++});return ROLES.map(([r,,one,many])=>`${c[r]} ${c[r]===1?one:many}`).join(", ")}
function bindPicker(f,save){
  const D=$("#pickD"), S=$("#pickS"), chips=$("#selChips"), q=$("#pickQ");
  const boxes=()=>[...f.querySelectorAll('input[name="int"]')];
  const paint=()=>{const sel=boxes().filter(b=>b.checked).map(b=>b.value);
    S.textContent=sel.length?`${sel.length} seleccionado${sel.length===1?"":"s"} · tocar para editar`:"Seleccionar integrantes";
    chips.innerHTML=sel.map(id=>`<button type="button" data-un="${id}" aria-label="Quitar ${esc(STAFF_BY[id].n)}">${esc(STAFF_BY[id].n)} ×</button>`).join("")+(sel.length?`<span class="tally">${esc(tally(sel))}</span>`:"");
    chips.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{const x=boxes().find(c=>c.value===b.dataset.un); if(x){x.checked=false; paint(); save();}});};
  f.addEventListener("change",e=>{ if(e.target.name==="int") paint(); });
  q.addEventListener("input",()=>{const t=q.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    f.querySelectorAll(".picker .opt").forEach(l=>{l.hidden=!!t&&!l.dataset.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(t)});
    f.querySelectorAll(".picker .grp").forEach(g=>{g.hidden=![...g.querySelectorAll(".opt")].some(l=>!l.hidden)});});
  paint();
}
function readForm(f){
  const fd=new FormData(f), o={};
  for(const [k,val] of fd.entries()){ if(k==="causas"||k==="int"){(o[k]=o[k]||[]).push(val)} else if(k!=="pickQ") o[k]=val }
  if(!o.causas) o.causas=[]; if(!o.int) o.int=[];
  return o;
}
function bold(t){
  const ac={"Á":"A\u0301","É":"E\u0301","Í":"I\u0301","Ó":"O\u0301","Ú":"U\u0301","Ñ":"N\u0303","á":"a\u0301","é":"e\u0301","í":"i\u0301","ó":"o\u0301","ú":"u\u0301","ñ":"n\u0303"};
  let out=""; for(const ch of t){ const x=ac[ch]||ch; for(const c of x){ const k=c.codePointAt(0);
    out+= k>=65&&k<=90?String.fromCodePoint(0x1D5D4+k-65): k>=97&&k<=122?String.fromCodePoint(0x1D5EE+k-97): k>=48&&k<=57?String.fromCodePoint(0x1D7EC+k-48): c; } }
  return out;
}
function asText(g,d){
  const L=[], H=t=>{L.push("",bold(t))}, it=(k,v)=>{ if(v) L.push(`- ${k}: ${v}`) };
  L.push(bold("Insumo · Taller de análisis de datos"),`${g.n} · ${g.nivel}`);
  H("IDENTIFICACIÓN"); L.push(`Participantes: ${tally(d.int||[])}`,`Integrantes: ${namesOf(d.int||[])||"—"}`);
  H("1. VER");
  [1,2,3].forEach(i=>d["h"+i]&&L.push(`- Hallazgo ${i} (${d["h"+i+"f"]||"s/f"}): ${d["h"+i]}`)); it("Sorpresa",d.sorpresa);
  H("2. PENSAR"); it("Problema priorizado",d.problema); it("OA aún no enseñados",d.oa); it("Hipótesis",d.hip); it("Ámbitos",(d.causas||[]).join(", "));
  H("3. DECIDIR · ACCIONES 2026");
  [1,2].forEach(i=>{ if(!d["a"+i]) return; L.push(`- Acción ${i}: ${d["a"+i]}`);
    const sub=[["Para",d["a"+i+"q"]],["Responsable(s)",d["a"+i+"r"]],["Plazo",d["a"+i+"p"]],["Evidencia",d["a"+i+"e"]]].filter(x=>x[1]).map(x=>`${x[0]}: ${x[1]}`).join(" · ");
    if(sub) L.push(`   ${sub}`); });
  H("ESTUDIANTES EN PELIGRO DE REPITENCIA"); it("Criterio académico",d.rAcad); it("Ausentismo",d.rAsis); it("Seguimiento",d.rResp);
  H("PROYECCIÓN 2027");
  [1,2].forEach(i=>{ if(!d["p"+i]) return; L.push(`- Estrategia ${i}: ${d["p"+i]}`);
    const sub=[["Momento",d["p"+i+"m"]],["PME",d["p"+i+"d"]]].filter(x=>x[1]).map(x=>`${x[0]}: ${x[1]}`).join(" · "); if(sub) L.push(`   ${sub}`); });
  H("APOYO Y SÍNTESIS"); it("Apoyo requerido",d.apoyo); it("Frase síntesis",d.frase);
  return L.join("\n");
}
function bindInsumo(g){
  const f=$("#insumo"), st=$("#st");
  f.querySelectorAll("textarea:not([hidden])").forEach(t=>{ if(t.id!=="copyFallback"){ t.maxLength = t.id==="hip"?250:160; t.rows=2; } });
  f.querySelectorAll('input[type="text"]').forEach(t=>{ if(t.id!=="frase") t.maxLength=100; });
  DB_READY.then(db=>{ if(db&&$("#sendBtn")){ $("#sendBtn").hidden=false; $("#shareBtn").hidden=true; $("#sendHint").innerHTML="El borrador se guarda en este celular. Al terminar, el/la escriba toca <b>Enviar al muro</b>. Si no aparece la confirmación, usa <b>Copiar respuestas</b> y envíalas a UTP."; } });
  $("#shareBtn").onclick=async()=>{
    const txt=asText(g,readForm(f));
    const a=document.createElement("a"); a.href="mailto:"+UTP_MAIL+"?subject="+encodeURIComponent("Insumo taller de análisis de datos · "+g.n+" ("+g.nivel+")")+"&body="+encodeURIComponent(txt.replace(/\n/g,"\r\n")); document.body.appendChild(a); a.click(); a.remove();

  };
  const save=()=>{store.set(draftKey(),readForm(f))};
  bindPicker(f,save);
  f.addEventListener("input",e=>{save(); if(e.target.id==="frase") $("#fraseN").textContent=e.target.value.length+"/140"});
  f.addEventListener("change",save);

    e.preventDefault(); save(); const d=readForm(f);
    if(!d.problema&&!d.h1){st.className="status err";st.textContent="Completa al menos un hallazgo y el problema priorizado antes de enviar.";return}
    if(!DB){st.className="status err";st.textContent="El muro en vivo no está disponible en este celular. Toca «Copiar respuestas» y envíalas a UTP.";return}
    const b=$("#sendBtn"); b.disabled=true; st.className="status"; st.textContent="Enviando…";
    try{ await DB.collection("insumos").doc(state.group).set({...d,grupo:state.group,nombre:g.n,nivel:g.nivel,actualizado:Date.now()});
      st.className="status ok"; st.textContent="Enviado al muro. Pueden seguir editando y volver a enviar.";
    }catch(err){ st.className="status err"; st.textContent="No se pudo enviar ("+(err&&err.code||"error")+"). Usa «Copiar respuestas» y envíalas a UTP."; }
    b.disabled=false;
  });
  $("#copyBtn").onclick=async()=>{
    const txt=asText(g,readForm(f));
    try{ await navigator.clipboard.writeText(txt); st.className="status ok"; st.innerHTML="Copiado. Pégalo en un correo a <b>"+UTP_MAIL+"</b>."; }
    catch(e){ const ta=$("#copyFallback"); ta.hidden=false; ta.value=txt; ta.style.minHeight="220px"; ta.focus(); ta.select(); st.className="status"; st.textContent="Selecciona el texto de abajo y cópialo."; }
  };
}

     <div class="pc"><h3>Confidencialidad</h3><p>Los paneles incluyen nombres de estudiantes: no se fotografían ni se comparten fuera del taller.</p></div>
   </div>`,
  `<span class="eyebrow">Grupos de trabajo</span><h2>Escaneen el código de su grupo</h2>
   <div class="qrs">${Object.entries(GRUPOS).map(([id,g])=>`<div class="qr"><div class="code" data-qr="${id}"></div><b>${g.n}</b><small>${g.nivel}</small></div>`).join("")}</div>
   <p class="lead">Cada código abre los datos del nivel, la pauta y el insumo. El/la escriba envía el insumo al muro al finalizar.</p>`,
  `<span class="eyebrow">Trabajo en grupos</span>
   <div class="phase" id="phase">${MOMENTOS.map(m=>`<div data-ph="${m.id}"><b>${m.n.replace("Momento ","")} · ${m.t.split(":")[0]}</b><span>${m.min} min</span></div>`).join("")}</div>
   <div class="bigtimer" id="bigClock">30:00</div>
   <div class="actions"><button class="btn" type="button" id="bigStart">Iniciar</button><button class="btn ghost" type="button" id="bigReset">Reiniciar</button><span class="note" id="bigHint">Avisaré el cambio de momento en pantalla.</span></div>`,
  `<span class="eyebrow">Plenario · 3 minutos por grupo</span><h2>Muro de acuerdos</h2>
   <div class="wall" id="wall"></div>
   <details class="pc" id="pasteBox"><summary style="cursor:pointer;font-weight:700">Agregar un insumo recibido por correo</summary>
     <div style="display:grid;gap:10px;margin-top:10px">
       <label for="pasteG">Grupo<select id="pasteG">${Object.entries(GRUPOS).map(([id,g])=>`<option value="${id}">${g.n} · ${g.nivel}</option>`).join("")}</select></label>
       <label for="pasteT">Texto copiado desde «Copiar respuestas»<textarea id="pasteT" style="min-height:120px"></textarea></label>
       <div class="actions"><button class="btn" type="button" id="pasteBtn">Agregar al muro</button><span class="status" id="pasteSt" role="status"></span></div></div></details>`,
  `<span class="eyebrow">Síntesis UTP</span><h2>Lo que vemos como escuela</h2>
   <div class="grid4">
     <div class="pc"><h3>La asistencia es el primer riesgo</h3><p>95 % del registro de peligro de repitencia se explica por asistencia bajo 85 %. En 1° a 8°, 35 estudiantes retroceden y 21 mejoran.</p></div>
     <div class="pc"><h3>Notas y aprendizajes no coinciden</h3><p>En Matemática, el DIA ubica a la mitad de 3° a 8° en nivel I, mientras los promedios van de 5,1 a 5,8. Necesitamos revisar qué evaluamos y con qué criterios.</p></div>
     <div class="pc"><h3>Leer para opinar con fundamentos</h3><p>Reflexionar es la habilidad lectora de menor logro en los siete cursos evaluados. Es una prioridad transversal a todas las asignaturas.</p></div>
     <div class="pc"><h3>Bienestar ante la evaluación</h3><p>Menos de la mitad de 4° a 8° llega tranquilo a una prueba, y en 7° y 8° pocos conversan sus emociones con un adulto antes de rendirla.</p></div>
   </div>`,
  `<span class="eyebrow">Cierre</span><h2>Próximos pasos</h2>
   <div class="grid3">
     <div class="pc"><h3>Esta semana</h3><p>UTP consolida los cuatro insumos en un plan de acción remedial noviembre–diciembre y lo devuelve a cada nivel.</p></div>
     <div class="pc"><h3>Antes del cierre del año</h3><p>Seguimiento en consejo de profesores; análisis de casos según el Decreto 67/2018 con informe técnico-pedagógico.</p></div>
     <div class="pc"><h3>2027</h3><p>Las estrategias de cada nivel alimentan la planificación anual del PME y el acompañamiento pedagógico (art. 12).</p></div>
   </div>
   <div class="grid3" style="align-items:start"><div class="qr"><div class="code" data-qr="ticket"></div><b>Ticket de salida</b><small>Formulario anónimo · 1 minuto</small></div>
   <div class="pc" style="grid-column:span 2"><h3>Cómo nos vamos</h3><p>Escaneen el código o abran la pestaña 5 · Ticket de su grupo. Las respuestas quedan registradas en la hoja del formulario para el análisis posterior.</p><p class="note">Para comentar en vivo: abre las respuestas del formulario en el notebook y lee algunas palabras en voz alta.</p></div></div>`
  ];
}
function buildDeck(){
  const deck=$("#deck");
  if(!deckBuilt){
    const S=slides();
    deck.innerHTML=`<div class="deck-top"><span class="brand">De los datos a las decisiones · Kallfü Mapu</span><span class="clockmini" id="miniClock"></span><button class="btn ghost themebtn" style="color:var(--blue-ink);border-color:currentColor" type="button" data-theme-toggle aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">☾</button><button class="btn ghost" style="color:var(--blue-ink);border-color:currentColor" type="button" id="exitDeck">Salir</button></div>
      <div style="min-height:0;display:grid">${S.map((s,i)=>`<section class="slide" data-i="${i}">${s}</section>`).join("")}</div>
      <div class="deck-nav"><button class="btn ghost" type="button" id="prevS">←</button><div class="dots">${S.map((_,i)=>`<button type="button" data-dot="${i}" aria-label="Diapositiva ${i+1}"></button>`).join("")}</div><button class="btn" type="button" id="nextS">→</button></div>`;
    deckBuilt=true; paintThemeButtons();
    $("#exitDeck").onclick=()=>{exitDeck();go("inicio")};
    $("#prevS").onclick=()=>show(slide-1); $("#nextS").onclick=()=>show(slide+1);
    deck.querySelectorAll("[data-dot]").forEach(b=>b.onclick=()=>show(+b.dataset.dot));
    deck.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{$("#rv-"+b.dataset.show).hidden=false;b.hidden=true});
    deck.querySelectorAll("[data-qr]").forEach(el=>{try{ new QRCode(el,{text:el.dataset.qr==="ticket"?FORM_URL:link(el.dataset.qr==="inicio"?"":el.dataset.qr),width:300,height:300,correctLevel:QRCode.CorrectLevel.M}) }catch(e){ el.innerHTML='<span style="color:#132033;font-size:.8rem;line-height:1.3">'+esc(el.dataset.qr==="ticket"?FORM_URL:link(el.dataset.qr))+'</span>' }});
    bindBig(); liveWall();
  }
  show(slide);
}
function show(i){ const n=document.querySelectorAll(".slide").length; slide=Math.max(0,Math.min(n-1,i));
  document.querySelectorAll(".slide").forEach(s=>s.classList.toggle("on",+s.dataset.i===slide));
  document.querySelectorAll("[data-dot]").forEach(b=>b.setAttribute("aria-current",String(+b.dataset.dot===slide))); }
function exitDeck(){ document.body.classList.remove("present") }
document.addEventListener("keydown",e=>{ if(state.view!=="proyectar") return; if(e.target.closest("input,textarea,select")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();show(slide+1)} if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(slide-1)} });
function bindBig(){
  const clock=$("#bigClock"), mini=$("#miniClock"), b=$("#bigStart");
  const paint=()=>{const left=bigT.run?Math.round((bigT.end-Date.now())/1000):bigT.left; const a=Math.abs(left);
    const txt=(left<0?"+":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");
    clock.textContent=txt; clock.style.color=left<0?"var(--n1)":""; mini.textContent=(bigT.run||bigT.left<1800)?"Trabajo grupal "+txt:"";
    const used=1800-left; const ph=used<600?"ver":used<1080?"pensar":"decidir";
    document.querySelectorAll("[data-ph]").forEach(d=>d.classList.toggle("on",(bigT.run||bigT.left<1800)&&d.dataset.ph===ph));
    $("#bigHint").textContent= left<=0?"Tiempo cumplido: preparen la tarjeta de plenario.": ph==="ver"?"Momento 1: describir los datos.":ph==="pensar"?"Momento 2: priorizar y explicar.":"Momento 3: acordar acciones y completar el insumo.";
    b.textContent=bigT.run?"Pausar":"Iniciar"};
  b.onclick=()=>{ if(bigT.run){bigT.left=Math.round((bigT.end-Date.now())/1000);bigT.run=false;clearInterval(bigT.iv)} else {bigT.end=Date.now()+bigT.left*1000;bigT.run=true;bigT.iv=setInterval(paint,500)} paint() };
  $("#bigReset").onclick=()=>{bigT.run=false;clearInterval(bigT.iv);bigT.left=1800;paint()};
  paint();
}
function wallCard(d){
  return `<article class="pc"><span class="who">${esc(d.nombre||"")} · ${esc(d.nivel||"")}</span>${d.frase?`<h3>«${esc(d.frase)}»</h3>`:""}
   <dl><dt>Problema priorizado</dt><dd>${esc(d.problema||"—")}</dd><dt>Acción 2026</dt><dd>${esc(d.a1||"—")}${d.a1r?" · "+esc(d.a1r):""}</dd>
   <dt>Estrategia 2027</dt><dd>${esc(d.p1||"—")}</dd>${d.apoyo?`<dt>Necesitan</dt><dd>${esc(d.apoyo)}</dd>`:""}${(d.int&&d.int.length)||d.integrantesTxt?`<dt>Integrantes</dt><dd class="note">${esc(d.int&&d.int.length?namesOf(d.int):d.integrantesTxt)}</dd>`:""}</dl></article>`;
}
let wallDb={}, wallLocal={};
function paintWall(){
  const wall=$("#wall"); if(!wall) return;
  wall.innerHTML=Object.entries(GRUPOS).map(([id,g])=>{const d=wallDb[id]||wallLocal[id]; return d?wallCard(d):`<article class="pc"><span class="who">${g.n} · ${g.nivel}</span><p class="note">Esperando el insumo del grupo.</p></article>`}).join("");
}
function parsePasted(t,g){
  const o={nombre:g.n,nivel:g.nivel}; const lines=t.split(/\r?\n/).map(x=>x.trim());
  const after=(...pres)=>{for(const pre of pres){const l=lines.find(x=>x.startsWith(pre)); if(l) return l.slice(pre.length).trim()} return ""};
  o.problema=after("- Problema priorizado:"); o.apoyo=after("- Apoyo requerido:","Apoyo requerido:"); const it=after("Integrantes:"); if(it&&it!=="—") o.integrantesTxt=it; o.frase=after("- Frase síntesis:","Frase síntesis:");
  const h=lines.find(x=>/^- Hallazgo 1/.test(x)); if(h) o.h1=h.replace(/^- Hallazgo 1( \([^)]*\))?:\s*/,"");
  const ai=lines.findIndex(x=>x.startsWith("- Acción 1:"));
  if(ai>=0){const a=lines[ai]; const parts=a.slice(11).split(" | "); o.a1=parts[0].trim(); let r=parts.find(p=>p.startsWith("Resp.:")); if(r) o.a1r=r.slice(6).trim();
    const nx=lines[ai+1]||""; if(!o.a1r&&!nx.startsWith("-")){ r=nx.split(" · ").find(p=>p.startsWith("Responsable(s):")); if(r) o.a1r=r.slice(15).trim(); } }
  const e1=after("- Estrategia 1:"); if(e1) o.p1=e1; else { const i27=lines.findIndex(x=>x==="PROYECCIÓN 2027"); if(i27>=0){const p=lines.slice(i27+1).find(x=>x.startsWith("- ")); if(p) o.p1=p.slice(2).split(" | ")[0].trim();} }
  if(!o.problema&&!o.a1&&!o.frase) o.problema=t.trim().slice(0,400);
  o.raw=t.slice(0,8000); o.actualizado=Date.now(); return o;
}
function liveWall(){
  const wall=$("#wall");
  paintWall();
  $("#pasteBtn").onclick=async()=>{ const id=$("#pasteG").value, g=GRUPOS[id], t=$("#pasteT").value, st=$("#pasteSt");
    if(!t.trim()){st.className="status err";st.textContent="Pega el texto del grupo primero.";return}
    const d=parsePasted(t,g); d.grupo=id; wallLocal[id]=d; delete wallDb[id]; paintWall(); $("#pasteT").value=""; $("#pasteBox").open=false;
    if(DB){ try{ await DB.collection("insumos").doc(id).set(d); st.className="status ok"; st.textContent="Agregado y guardado."; }catch(e){ st.className="status"; st.textContent="Agregado en esta pantalla (no se pudo guardar en línea)."; } }
    else { st.className="status"; st.textContent="Agregado en esta pantalla."; } };
  const start=()=>{
    if(!DB){ wall.insertAdjacentHTML("beforebegin",`<p class="note">El envío en vivo no está disponible en esta pantalla. Pega abajo los insumos que lleguen por correo, o cada voz del grupo presenta desde la pestaña Plenario.</p>`); return; }
    try{
      unsubs.push(DB.collection("insumos").onSnapshot(s=>{
        wallDb={}; s.docs.forEach(d=>wallDb[d.id]=d.data()); paintWall();
      },()=>{}));
      unsubs.push(DB.collection("apuestas").onSnapshot(s=>{
        APUESTAS.forEach(a=>{ const c=[0,0,0,0]; s.docs.forEach(d=>{const x=d.data(); if(x.q===a.id&&x.o>=0&&x.o<4) c[x.o]++}); const tot=c.reduce((p,q)=>p+q,0);
          const el=$("#dist-"+a.id); if(el) el.innerHTML= tot?a.opts.map((o,j)=>bar(o+" · "+c[j],100*c[j]/tot,false)).join("")+`<p class="note">${tot} respuestas</p>`:""; });
      },()=>{}));
      unsubs.push(DB.collection("tickets").onSnapshot(s=>{
        const w={}; s.docs.forEach(d=>{const p=(d.data().palabra||"").trim().toLowerCase(); if(p) w[p]=(w[p]||0)+1});
        const el=$("#words"); const e=Object.entries(w); if(el&&e.length) el.innerHTML=e.sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<span style="font-size:${1+Math.min(n,6)*.35}rem">${esc(p)}</span>`).join("");
      },()=>{}));
    }catch(e){}
  };
  DB_READY.then(start);
}

/* ---------- arranque ---------- */
(function boot(){ paintThemeButtons(); const h=location.hash.slice(1); if(h&&(/^g[1-4]$/.test(h)||["apuesta","salida","proyectar"].includes(h))) go(h); else render(); })();
</script>
